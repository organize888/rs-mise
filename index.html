<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1a0a0e" />
  <title>RS Mise · 私廚行程與採購</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#14080b; --bg2:#1c0d11; --card:#241116; --line:rgba(201,162,39,.22);
      --gold:#c9a227; --gold2:#e8d5a3; --gold3:#8a6d1a; --burg:#8b2332; --burg2:#6b1d2a;
      --text:#f4ead8; --muted:#b9a89a; --ok:#7dba7a; --warn:#d4a017; --bad:#d45a5a;
      --safe:env(safe-area-inset-bottom,16px);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Noto Sans TC",system-ui,sans-serif}
    .app{height:100dvh;height:100svh;display:flex;flex-direction:column;overflow:hidden}
    button,input,select,textarea{font-family:inherit}
    h1,h2,h3,.serif{font-family:"Cormorant Garamond",serif}
    .top{flex:0 0 auto;background:#1a0a0e;border-bottom:1px solid var(--line);padding:14px 18px 10px}
    .brand{display:flex;align-items:center;gap:12px}
    .mono{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,#3a1820,#1a0a0e);color:var(--gold2);font-family:"Cormorant Garamond",serif;font-weight:700;font-size:16px}
    .brand h1{margin:0;font-size:20px;letter-spacing:2px;color:var(--gold2);font-weight:600}
    .brand p{margin:0;font-size:11px;letter-spacing:1.4px;color:var(--muted)}
    .wrap{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 24px;max-width:740px;width:100%;margin:0 auto}
    .hidden{display:none!important}
    .card{background:linear-gradient(180deg,var(--card),#1e0e13);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
    .card h2{margin:0 0 10px;font-size:20px;color:var(--gold2);font-weight:600}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .field{flex:1;min-width:120px}
    label{display:block;font-size:11px;letter-spacing:1px;color:var(--muted);margin-bottom:6px}
    input,select,textarea{width:100%;background:#12070a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
    textarea{min-height:140px;line-height:1.45;font-size:14px}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
    .metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .metric{background:#16090c;border:1px solid var(--line);border-radius:12px;padding:12px}
    .metric span{display:block;font-size:11px;color:var(--muted)}
    .metric b{display:block;margin-top:4px;font-size:22px;font-family:"Cormorant Garamond",serif;color:var(--gold2);font-weight:600}
    .metric.wide{grid-column:1/-1}
    .btn{appearance:none;border:1px solid var(--gold3);background:transparent;color:var(--gold2);border-radius:999px;padding:9px 14px;font-size:13px;cursor:pointer}
    .btn.gold{background:linear-gradient(180deg,#d4b44a,#9a7a1c);border-color:#c9a227;color:#1a0a0e;font-weight:600}
    .btn.solid{background:linear-gradient(180deg,#9a2a3a,var(--burg2));border-color:#a83a48;color:#fff8ea}
    .btn.ghost{opacity:.8}
    .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .split{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
    .hint{font-size:12px;color:var(--muted);line-height:1.55}
    .pill{font-size:10px;letter-spacing:.6px;border:1px solid var(--line);border-radius:99px;padding:3px 8px;color:var(--muted);white-space:nowrap}
    .pill.on{border-color:var(--gold3);color:var(--gold2)}
    .event{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#1a0c10}
    .event h3{margin:0 0 4px;font-size:17px;color:var(--gold2)}
    .muted{color:var(--muted);font-size:12px;line-height:1.45}
    .nav{flex:0 0 auto;position:relative;left:auto;right:auto;bottom:auto;z-index:30;background:#16090c;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 2px calc(8px + var(--safe))}
    .nav button{background:none;border:0;color:var(--muted);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0}
    .nav button.on{color:var(--gold2)}
    .nav .ico{font-size:16px}
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:40;display:grid;place-items:end center}
    .sheet{width:100%;max-width:740px;background:var(--bg2);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(22px + var(--safe));max-height:90vh;overflow:auto}
    .danger{color:var(--bad);background:none;border:0;font-size:12px;cursor:pointer}
    .empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:13px}
    .bar{height:8px;background:#2a1418;border-radius:99px;overflow:hidden;margin-top:10px}
    .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold3),var(--gold))}
    .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
    .chip{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:6px 12px;font-size:12px}
    .chip.on{background:var(--burg2);color:var(--gold2);border-color:var(--gold3)}
    .search{position:relative;margin-bottom:10px}
    .search input{padding-left:36px}
    .search::before{content:"⌕";position:absolute;left:12px;top:10px;color:var(--gold)}
    .shop-item{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:start;padding:10px 0;border-bottom:1px solid rgba(201,162,39,.08)}
    .shop-item b{display:block;font-weight:600;font-size:14px}
    .vendor-name{color:var(--gold2);font-size:12px;margin-top:2px}
    .qty-badge{font-family:"Cormorant Garamond",serif;font-size:20px;color:var(--gold2);white-space:nowrap}
    .check{width:18px;height:18px;margin-top:4px}
    .recipe{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#1a0c10}
    .tags{display:flex;gap:6px;flex-wrap:wrap}
    .tag{font-size:10px;padding:3px 7px;border-radius:6px;background:#2a151a;color:var(--gold2);border:1px solid var(--line)}
    .links{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .links a{text-decoration:none}
    .status.ok{color:var(--ok)} .status.warn{color:var(--warn)} .status.bad{color:var(--bad)}
    .foot-note{font-size:11px;color:var(--muted);margin-top:8px}
    .when{font-size:13px;color:var(--gold2)}
    @media print {
      .top,.nav,.btn,.btn-row,.no-print{display:none!important}
      body{background:#fff;color:#111;padding:0}
      .card,.event,.recipe{border:1px solid #ccc;background:#fff;color:#111}
      .wrap{max-width:none}
    }
  </style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand">
    <div class="mono">RS</div>
    <div>
      <h1>ROOM SERVICE</h1>
      <p>Mise · Schedule · Sourcing</p>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="tab-cal">
    <div class="card">
      <div class="split">
        <h2>行程</h2>
        <button class="btn gold" onclick="openEventForm()">＋ 新活動</button>
      </div>
      <p class="hint">登記日期與人數，套上菜單後一鍵出採購單。數量會進位成你實際買得到的整數（不會出現 2.5 顆蘋果）。</p>
      <div id="calList"></div>
    </div>
  </section>

  <section id="tab-menu" class="hidden">
    <div class="card">
      <div class="split">
        <h2>菜單／食譜庫</h2>
        <button class="btn gold" onclick="openRecipeForm()">＋ 新食譜</button>
      </div>
      <p class="hint">從相簿選食譜照片、上傳 PDF，或直接在下面打／貼食譜文字。</p>
      <div class="btn-row" style="margin-top:0">
        <label class="btn gold" style="display:inline-flex;align-items:center;cursor:pointer">
          從相簿選照片
          <input id="photoLib" type="file" accept="image/jpeg,image/png,image/heic,image/heif,image/webp,.jpg,.jpeg,.png,.heic,.webp" multiple style="display:none" onchange="onRecipeFile(this)">
        </label>
        <label class="btn" style="display:inline-flex;align-items:center;cursor:pointer">
          上傳 PDF
          <input id="pdfLib" type="file" accept="application/pdf,.pdf" multiple style="display:none" onchange="onPdfFile(this)">
        </label>
      </div>
      <div class="field" style="margin-top:14px">
        <label>在這裡打食譜</label>
        <textarea id="menuTypeBox" placeholder="例：&#10;# 冷盤 Hamachi&#10;Hamachi 1.75 oz&#10;白蘿蔔 1 顆&#10;紫蘇 2 片"></textarea>
      </div>
      <div class="btn-row">
        <button class="btn gold" onclick="showScanReview($('#menuTypeBox').value, scanTargetEvent)">解析並列入食材</button>
      </div>
      <div id="recipeList"></div>
    </div>
  </section>

  <section id="tab-shop" class="hidden">
    <div class="card">
      <div class="split">
        <h2>採購單</h2>
        <button class="btn" onclick="window.print()">列印</button>
      </div>
      <div class="field">
        <label>要採購的活動</label>
        <select id="shopEvent" onchange="state.activeEvent=this.value;save();renderShop()"></select>
      </div>
      <div class="btn-row">
        <button class="btn gold" onclick="buildShop()">依菜單重算清單</button>
        <button class="btn" onclick="clearBought()">清掉已買</button>
      </div>
      <p class="hint" id="shopHint"></p>
      <div id="shopList"></div>
    </div>
  </section>

  <section id="tab-cogs" class="hidden">
    <div class="card">
      <h2>成本控制</h2>
      <p class="hint">跟目前選中的活動連動。也可手動改人數／售價。</p>
      <div class="field" style="margin-bottom:10px">
        <label>計算哪一場</label>
        <select id="cogsEvent" onchange="pickCogsEvent(this.value)"></select>
      </div>
      <div class="row">
        <div class="field"><label>人數</label><input id="guests" type="number" min="1" value="6"></div>
        <div class="field"><label>每位售價 USD</label><input id="price" type="number" min="0" value="175"></div>
      </div>
      <div class="row" style="margin-top:10px">
        <div class="field"><label>或直接填總餐費</label><input id="totalRev" type="number" min="0" placeholder="空白＝人數×單價"></div>
        <div class="field"><label>目標食材成本 %</label><input id="cogsPct" type="number" min="1" max="80" step="0.5" value="30"></div>
      </div>
      <div id="eventMetrics" class="metrics"></div>
      <div id="actualBox"></div>
    </div>
  </section>

  <section id="tab-vendors" class="hidden">
    <div class="card">
      <h2>採購來源</h2>
      <div class="search"><input id="vSearch" placeholder="搜尋商家、品項…" oninput="renderVendors()"></div>
      <div class="chips" id="vChips"></div>
      <div class="btn-row" style="margin:0 0 10px">
        <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/Asian+supermarket+near+Jersey+City+NJ">地圖：亞洲超市</a>
        <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=135+Greene+St+Jersey+City+NJ">導航 Whole Foods</a>
        <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=43+Edward+Hart+Dr+Jersey+City+NJ">導航 Yama</a>
      </div>
      <div id="vendorList"></div>
    </div>
  </section>

  <section id="tab-inv" class="hidden">
    <div class="card">
      <div class="split">
        <h2>庫存</h2>
        <button class="btn gold" onclick="openInvForm()">＋ 入庫</button>
      </div>
      <p class="hint">記冰箱／冷凍／乾貨現有量。出採購單時會先扣庫存，只買不夠的；也可設安全庫存（par），低於就補。</p>
      <div class="search"><input id="invSearch" placeholder="搜尋庫存…" oninput="renderInv()"></div>
      <div class="chips" id="invChips"></div>
      <div id="invList"></div>
      <div class="btn-row">
        <button class="btn" onclick="consumeForEvent()">依本場菜單扣庫存</button>
        <button class="btn" onclick="receiveBought()">把已勾選採購入庫</button>
      </div>
    </div>
  </section>
</main>

<nav class="nav">
  <button class="on" data-tab="cal" onclick="switchTab('cal')"><span class="ico">▦</span>行程</button>
  <button data-tab="menu" onclick="switchTab('menu')"><span class="ico">🍽</span>菜單</button>
  <button data-tab="shop" onclick="switchTab('shop')"><span class="ico">☰</span>採購</button>
  <button data-tab="inv" onclick="switchTab('inv')"><span class="ico">▣</span>庫存</button>
  <button data-tab="cogs" onclick="switchTab('cogs')"><span class="ico">◎</span>成本</button>
  <button data-tab="vendors" onclick="switchTab('vendors')"><span class="ico">⌂</span>商家</button>
</nav>

<div id="modal" class="modal-bg hidden" onclick="if(event.target.id==='modal')closeModal()"><div class="sheet" id="sheet"></div></div>
</div>

<script>

const num = v => { const n=parseFloat(v); return isFinite(n)?n:0; };
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const escAttr = s => esc(s).replace(/'/g,"&#39;");
const uid = () => "id"+Math.random().toString(36).slice(2,9);

  "99 Ranch / 亞洲超市": { type:"當地超市", addr:"Jersey City 99 Ranch / Asian Food Market Rt 440", maps:"https://www.google.com/maps/search/99+Ranch+Market+Jersey+City", web:"", phone:"" },

const VENDORS = [
  { name:"Yama Seafood", cat:["海鮮","日料","附近","批發"], type:"當地取貨 / 配送", addr:"43 Edward Hart Dr, Jersey City, NJ 07305", phone:"201-433-3888", web:"https://shop.yamaseafood.com/", maps:"https://maps.google.com/?q=43+Edward+Hart+Dr+Jersey+City+NJ+07305", note:"壽司級鮪、鰤、干貝、甜蝦、海膽。JC 倉庫可取貨，最低約 $50；當地配送最低約 $75，11am 截單。" },

  { name:"Whole Foods JC", cat:["超市","附近","蔬果","乳品"], type:"零售", addr:"135 Greene St, Jersey City, NJ 07311", phone:"201-885-5388", web:"https://www.wholefoodsmarket.com/stores/jerseycity", maps:"https://maps.google.com/?q=135+Greene+St+Jersey+City+NJ", note:"Downtown JC。有機蔬果、乳品、香草、雞蛋、奶油、一般蛋白。不適合壽司級魚。" },

  { name:"Asian Food Market", cat:["亞洲","附近","超市"], type:"零售", addr:"701 State Rt 440, Jersey City, NJ 07304", phone:"201-333-8898", web:"", maps:"https://maps.google.com/?q=701+State+RT+440+Jersey+City+NJ", note:"JC 本地亞洲超市，蔬果＋醬料＋部分肉。" },

  { name:"True World Foods", cat:["海鮮","日料","批發"], type:"日料批發", addr:"NJ / NYC", phone:"", web:"https://www.trueworldfoods.com/", maps:"https://www.google.com/maps/search/True+World+Foods+NJ", note:"日料常用：海苔、味醂、醬油、部分冷凍魚。" },
  { name:"LP Seafood & Specialty", cat:["海鮮","特色"], type:"NYC 配送", addr:"New York, NY", phone:"", web:"https://www.lpssnyc.com/", maps:"https://www.lpssnyc.com/", note:"鮮切魚、活貝、煙燻魚、進口奶油。" }

const COUNT_UNITS = new Set(["pc","pcs","ea","each","顆","個","粒","隻","條","片","份","顆","枚"]);
const BUNCH_UNITS = new Set(["bunch","bunches","把","束"]);
const COUNT_NAMES = /apple|蘋果|pear|梨|lemon|檸檬|lime|萊姆|orange|橙|onion|洋蔥|shallot|紅蔥|egg|蛋|artichoke|洋薊|avocado|酪梨|mango|芒果|peach|桃|tomato|番茄|pepper|椒|cucumber|小黃瓜|head of|顆/;

function normUnit(u) {
  u = (u||"").toLowerCase().trim();
  if (["ounce","ounces","ozs"].includes(u)) return "oz";
  if (["pound","pounds","lbs","#"].includes(u)) return "lb";
  if (["gram","grams","公克","克"].includes(u) || u==="g") return "g";
  if (["kg","公斤"].includes(u)) return "kg";
  if (["ml","毫升"].includes(u)) return "ml";
  if (["l","liter","公升"].includes(u)) return "l";
  if (["tsp","teaspoon"].includes(u)) return "tsp";
  if (["tbsp","tablespoon","大匙"].includes(u)) return "tbsp";
  if (COUNT_UNITS.has(u)) return "pc";
  if (BUNCH_UNITS.has(u)) return "bunch";
  return u || "pc";
}

function isCount(name, unit) {
  const u = normUnit(unit);
  if (u==="pc" || u==="bunch") return true;
  if (["oz","lb","g","kg","ml","l","tsp","tbsp","cup","pt","qt"].includes(u)) return false;
  return COUNT_NAMES.test((name||"").toLowerCase());
}

function shopRound(name, qty, unit) {
  const u = normUnit(unit);
  qty = Math.max(0, num(qty));
  if (isCount(name, u) || u==="pc") {
    return { qty: Math.max(1, Math.ceil(qty - 1e-9)), unit: "顆／件", rawUnit:"pc" };
  }
  if (u==="bunch") {
    return { qty: Math.max(1, Math.ceil(qty - 1e-9)), unit: "把", rawUnit:"bunch" };
  }
  if (u==="g") {
    if (qty >= 450) return shopRound(name, qty/453.6, "lb");
    return { qty: Math.max(50, Math.ceil(qty/25)*25), unit:"g", rawUnit:"g" };
  }
  if (u==="kg") return shopRound(name, qty*2.2046, "lb");
  if (u==="oz") {
    if (qty >= 12) return shopRound(name, qty/16, "lb");
    return { qty: Math.max(1, Math.ceil(qty - 1e-9)), unit:"oz", rawUnit:"oz" };
  }
  if (u==="lb") {
    if (qty < 0.4) return { qty: Math.max(4, Math.ceil(qty*16)), unit:"oz", rawUnit:"oz" };
    const half = Math.ceil(qty * 2 - 1e-9) / 2;
    return { qty: half, unit:"lb", rawUnit:"lb" };
  }
  if (u==="ml") {
    if (qty >= 700) return { qty: Math.ceil(qty/750), unit:"瓶", rawUnit:"btl" };
    return { qty: Math.max(50, Math.ceil(qty/50)*50), unit:"ml", rawUnit:"ml" };
  }
  if (u==="tsp" || u==="tbsp") {
    return { qty: 1, unit:"一小罐／現有庫存", rawUnit:u, pantry:true };
  }
  return { qty: Math.max(1, Math.ceil(qty - 1e-9)), unit: u || "件", rawUnit:u||"pc" };
}

function fmtQty(q, unit) {
  if (unit==="lb" && q % 1 !== 0) {
    const whole = Math.floor(q);
    const frac = q - whole;
    const oz = Math.round(frac*16);
    if (whole===0) return `${oz} oz`;
    if (oz===0) return `${whole} lb`;
    return `${whole} lb ${oz} oz`;
  }
  if (q % 1 === 0) return `${q} ${unit}`;
  return `${q} ${unit}`;
}

function fmtDate(iso) {
  if (!iso) return "未定日期";
  const [y,m,d] = iso.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  const w = "日一二三四五六"[dt.getDay()];
  return `${m}/${d}（週${w}）`;
}

function toBase(qty, u) {
  u = normUnit(u);
  if (u==="lb") return { q:num(qty)*16, b:"oz" };
  if (u==="oz") return { q:num(qty), b:"oz" };
  if (u==="g") return { q:num(qty)/28.3495, b:"oz" };
  if (u==="kg") return { q:num(qty)*35.274, b:"oz" };
  if (u==="ml") return { q:num(qty), b:"ml" };
  if (u==="l") return { q:num(qty)*1000, b:"ml" };
  return { q:num(qty), b:u||"pc" };
}
function fromBase(q, b, prefer) {
  const p = normUnit(prefer||b);
  if (b==="oz" && (p==="lb" || q>=12)) return { qty:q/16, u:"lb" };
  if (b==="oz") return { qty:q, u:"oz" };
  return { qty:q, u:p||b };
}
function normName(s){ return String(s||"").toLowerCase().replace(/[（）()]/g," ").replace(/\s+/g," ").trim(); }
function invMatch(name) {
  const n = normName(name);
  const list = state.inventory||[];
  return list.find(i => {
    const a = normName(i.n);
    return a===n || a.includes(n) || n.includes(a);
  });
}
function haveQty(name, unit) {
  const row = invMatch(name);
  if (!row) return 0;
  const have = toBase(row.qty, row.u);
  const needU = toBase(1, unit);
  if (have.b !== needU.b) {
    if (normUnit(row.u)===normUnit(unit) || isCount(name, unit) && isCount(row.n, row.u)) return num(row.qty);
    return 0;
  }
  return have.q;
}

let scanTargetEvent = "";

function pickRecipeFile(kind, eid) {

function onRecipeFile(inp) {
  const files = [...(inp.files||[])];
  if (!files.length) return;
  const pdfs = files.filter(f => /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name));
  const imgs = files.filter(f => !pdfs.includes(f) && (/^image\//.test(f.type) || /\.(heic|heif|jpg|jpeg|png|webp|gif)$/i.test(f.name)));
  const texts = files.filter(f => !pdfs.includes(f) && !imgs.includes(f));
  if (pdfs.length) scanPdfFiles(pdfs, scanTargetEvent);
  else if (imgs.length) scanRecipeImages(imgs, scanTargetEvent);
  else if (texts[0]) {
    const reader = new FileReader();
    reader.onload = () => showScanReview(String(reader.result||""), scanTargetEvent);
    reader.readAsText(texts[0]);
  }
}
function onPdfFile(inp) {
  const files = [...(inp.files||[])];
  inp.value = "";
  if (!files.length) return;
  const bad = files.filter(f => !f.size);
  if (bad.length) {
    alert("這個 PDF 還在 iCloud 雲端、本機是空的。回到檔案 App 先點雲朵下載，等檔案變可開再用。");
    return;
  }
  scanPdfFiles(files, scanTargetEvent);
}
function looksLikePdf(buf) {
  const u = new Uint8Array(buf.slice(0, 8));
  return u.length>=4 && u[0]===0x25 && u[1]===0x50 && u[2]===0x44 && u[3]===0x46; // %PDF
}
function loadPdfJs() {
  return new Promise((resolve, reject) => {
    if (window.pdfjsLib) return resolve(window.pdfjsLib);
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js";
    s.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
      resolve(window.pdfjsLib);
    };
    s.onerror = () => reject(new Error("PDF 套件載入失敗"));
    document.head.appendChild(s);
  });
}
async function scanPdfFiles(files, eid) {
  const list = Array.isArray(files) ? files : [files];
  let all = "";
  for (const f of list) {
    const t = await scanPdfFile(f, eid, true);
    if (t) all += (all?"\n\n":"") + t;
  }
  if (!all.trim()) {
    $("#sheet").innerHTML = `<h2 class="serif" style="margin:0 0 8px;color:var(--gold2)">讀不到 PDF</h2><p class="hint">若檔案上有雲朵或 Error，先在「檔案」App 下載到本機再傳。也可把 PDF 截圖後用「從相簿選照片」。</p><div class="btn-row"><button class="btn ghost" onclick="closeModal()">關閉</button></div>`;
    $("#modal").classList.remove("hidden");
    return;
  }
  showScanReview(all, eid);
}
async function scanPdfFile(file, eid, returnText) {
  $("#sheet").innerHTML = `
    <h2 class="serif" style="margin:0 0 8px;color:var(--gold2)">讀取 PDF</h2>
    <p class="hint" id="scanStat">正在打開「${esc(file.name)}」…</p>
    <div class="bar"><i id="scanBar" style="width:8%"></i></div>
    <div class="btn-row"><button class="btn ghost" onclick="closeModal()">取消</button></div>
  `;
  $("#modal").classList.remove("hidden");
  try {
    const pdfjs = await loadPdfJs();
    const buf = await file.arrayBuffer();
    const pdf = await pdfjs.getDocument({ data: buf, disableWorker: true }).promise;
    const n = Math.min(pdf.numPages, 20);
    let text = "";
    for (let p=1; p<=n; p++) {
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      const t = (tc.items||[]).map(i=>i.str).join(" ").replace(/\s+/g," ").trim();
      if (t) text += t + "\n";
      const st = $("#scanStat"); if (st) st.textContent = `讀第 ${p}/${n} 頁文字…`;
      const bar = $("#scanBar"); if (bar) bar.style.width = Math.round(p/n*50) + "%";
    }
    const letters = (text.match(/[A-Za-z\u4e00-\u9fff]/g)||[]).length;
    if (letters < 40) {
      const st = $("#scanStat"); if (st) st.textContent = "這份 PDF 幾乎沒有文字，改成逐頁掃描圖片…";
      const T = await loadTesseract();
      const worker = await T.createWorker("eng+chi_tra", 1, {
        logger: m => {
          const st2 = $("#scanStat");
          if (st2 && m.status==="recognizing text") st2.textContent = "掃描頁面 " + Math.round((m.progress||0)*100) + "%";
        }
      });
      const ocrParts = [];
      for (let p=1; p<=n; p++) {
        const page = await pdf.getPage(p);
        const vp = page.getViewport({ scale: 1.6 });
        const c = document.createElement("canvas");
        c.width = vp.width; c.height = vp.height;
        await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
        const { data } = await worker.recognize(c);
        if (data && data.text) ocrParts.push(data.text.trim());
        const bar = $("#scanBar"); if (bar) bar.style.width = Math.round(50 + p/n*50) + "%";
      }
      await worker.terminate();
      text = ocrParts.filter(Boolean).join("\n\n");
    }
    if (!text.trim()) {
      $("#scanStat").textContent = "PDF 裡沒讀到食譜文字。改上傳照片或直接打字。";
      return "";
    }
    if (returnText) return text;
    showScanReview(text, eid);
    return text;
  } catch (err) {
    const st = $("#scanStat");
    if (st) st.textContent = "PDF 讀取失敗：" + (err.message||err);
    return "";
  }
}

function loadTesseract() {
  return new Promise((resolve, reject) => {
    if (window.Tesseract) return resolve(window.Tesseract);
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    s.onload = () => resolve(window.Tesseract);
    s.onerror = () => reject(new Error("OCR 套件載入失敗"));
    document.head.appendChild(s);
  });
}
function resizeForOcr(file) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 1600;
      let w = img.width, h = img.height;
      if (w > max) { h = Math.round(h * max / w); w = max; }
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(b => resolve(b || file), "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}
async function scanRecipeImages(files, eid) {
  const list = Array.isArray(files) ? files : [files];
  $("#sheet").innerHTML = `
    <h2 class="serif" style="margin:0 0 8px;color:var(--gold2)">掃描食譜照片</h2>
    <p class="hint" id="scanStat">從相簿讀取 ${list.length} 張，準備辨識…第一次會下載語系檔。</p>
    <div class="bar"><i id="scanBar" style="width:8%"></i></div>
    <img id="scanPrev" alt="" style="width:100%;margin-top:12px;border-radius:12px;border:1px solid var(--line);max-height:220px;object-fit:cover">
    <div class="btn-row"><button class="btn ghost" onclick="closeModal()">取消</button></div>
  `;
  $("#modal").classList.remove("hidden");
  try {
    const T = await loadTesseract();
    const worker = await T.createWorker("eng+chi_tra", 1, {
      logger: m => {
        const st = $("#scanStat"); const bar = $("#scanBar");
        if (!st) return;
        const p = Math.round((m.progress||0)*100);
        if (m.status==="loading language traineddata") st.textContent = "下載中英辨識檔…";
        else if (m.status==="recognizing text") st.textContent = "正在讀食材 " + p + "%";
        else st.textContent = m.status || "處理中…";
        if (bar) bar.style.width = Math.max(8, p) + "%";
      }
    });
    const chunks = [];
    for (let i=0;i<list.length;i++) {
      const file = list[i];
      const st = $("#scanStat");
      if (st) st.textContent = `辨識第 ${i+1}/${list.length} 張：${file.name}`;
      const prev = $("#scanPrev");
      if (prev) prev.src = URL.createObjectURL(file);
      const blob = await resizeForOcr(file);
      const { data } = await worker.recognize(blob);
      const t = (data && data.text || "").trim();
      if (t) chunks.push(t);
    }
    await worker.terminate();
    const text = chunks.join("\n\n");
    if (!text) {
      $("#scanStat").textContent = "沒讀到字。換一張較清楚的照片，或改貼文字。";
      return;
    }
    showScanReview(text, eid);
  } catch (err) {
    const st = $("#scanStat");
    if (st) st.textContent = "辨識失敗：" + (err.message||err) + "。改貼文字也可以。";
  }
}

function fracToNum(s) {
  s = String(s||"").trim().replace(/½/g,"1/2").replace(/⅓/g,"1/3").replace(/¼/g,"1/4").replace(/¾/g,"3/4").replace(/⅔/g,"2/3");
  const mix = s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if (mix) return num(mix[1]) + num(mix[2])/num(mix[3]);
  const fr = s.match(/^(\d+)\s*\/\s*(\d+)$/);
  if (fr) return num(fr[1])/num(fr[2]);
  return num(s);
}
const UNIT_WORD = "oz|ounces?|lb|lbs|pounds?|g|grams?|kg|ml|l|cup|cups|tbsp|tablespoons?|tsp|teaspoons?|bunch|bunches|pc|pcs|ea|each|顆|個|粒|隻|條|片|把|束|克|公斤|毫升|大匙|小匙|茶匙|湯匙";
const QTY_WORD = "(\\d+(?:\\.\\d+)?(?:\\s+\\d+\\/\\d+)?|\\d+\\/\\d+|[½⅓¼¾⅔])";

function cleanIngName(n) {
  return String(n||"")
    .replace(/^[-*•●○]\s*/, "")
    .replace(/\s*[•·]\s*/g, " ")
    .replace(/\s*\([^)]*(?:drain|soak|mince|chop|blanch|strain|taste|optional)[^)]*\)/ig, "")
    .replace(/\s+(?:drained|soaked|soak soft|mince[d]?|chopped|blanched|strained|to taste|optional|mount)\b.*$/ig, "")
    .replace(/[，,]+$/,"")
    .replace(/\s+/g, " ")
    .trim();
}
function isJunkLine(line) {
  return /^(ingredients|食材|材料|directions|作法|步驟|method|instructions|notes?|procedure)$/i.test(line)
    || /^(heat|add|whisk|bring|simmer|fold|plate|serve|煮|拌|加入|加熱)/i.test(line);
}
function explodeQtyPairs(line) {
  const re = new RegExp(QTY_WORD+"\\s*("+UNIT_WORD+")","gi");
  const found = [];
  let m;
  while ((m = re.exec(line))) found.push({ i:m.index, len:m[0].length, per:fracToNum(m[1]), u:normUnit(m[2]) });
  if (found.length < 2) return null;
  const items = [];
  for (let k=0;k<found.length;k++) {
    const start = k===0 ? 0 : found[k-1].i + found[k-1].len;
    const name = cleanIngName(line.slice(start, found[k].i));
    if (name) items.push({ n:name, per:found[k].per, u:found[k].u });
  }
  return items.length ? items : null;
}

function parseRecipesFromText(text) {
  let serves = 1;
  const sm = String(text).match(/(?:serves|yield|份量|供)\s*[:：]?\s*(\d+)/i);
  if (sm) serves = Math.max(1, num(sm[1]));
  const scale = x => serves>1 && x!=null ? +(Number(x)/serves).toFixed(3) : x;
  const lines = String(text||"").replace(/\r/g,"\n").split(/\n/).map(s=>s.replace(/\s+/g," ").trim()).filter(Boolean);
  const courses = [];
  let cur = { name:"掃描的菜", course:"其他", ings:[] };
  let pendingQty = null;
  const startNew = (name, course) => {
    if (cur.ings.length || (cur.name && cur.name!=="掃描的菜")) courses.push(cur);
    cur = { name: name || "未命名", course: course || "其他", ings:[] };
    pendingQty = null;
  };
  const pushIng = (n, per, u) => {
    n = cleanIngName(n);
    if (!n || /^\d/.test(n) && n.length<8) return;
    if (isJunkLine(n)) return;
    cur.ings.push({ n, per: per==null?null:scale(per), u: u||null, vendor:"" });
  };
  for (const raw of lines) {
    if (/^(serves|yield|份量|人數)/i.test(raw)) continue;
    if (isJunkLine(raw) && raw.length<40) continue;
    if (/^#/.test(raw) || /^(前菜|冷盤|海鮮|招牌|主菜|甜點)\b/.test(raw) || (/[:：]\s*$/.test(raw) && raw.length<40)) {
      let name = raw.replace(/^#+\s*/,"").replace(/[:：]\s*$/,"").trim();
      let course = "其他";
      const hm = name.match(/^(前菜|冷盤|海鮮|招牌|主菜|甜點)\s*/);
      if (hm) { course = hm[1]; name = name.slice(hm[0].length).trim() || hm[1]; }
      startNew(name, course);
      continue;
    }
    const many = explodeQtyPairs(raw);
    if (many) { many.forEach(it => pushIng(it.n, it.per, it.u)); pendingQty=null; continue; }
    let m = raw.match(new RegExp("^"+QTY_WORD+"\\s*("+UNIT_WORD+")$","i"));
    if (m) {
      const per = fracToNum(m[1]), u = normUnit(m[2]);
      const last = cur.ings[cur.ings.length-1];
      if (last && last.per==null) { last.per = scale(per); last.u = u; }
      else pendingQty = { per, u };
      continue;
    }
    m = raw.match(new RegExp("^"+QTY_WORD+"\\s*("+UNIT_WORD+")\\s+(.+)$","i"));
    if (m) { pushIng(m[3], fracToNum(m[1]), normUnit(m[2])); pendingQty=null; continue; }
    m = raw.match(new RegExp("^(.+?)\\s+"+QTY_WORD+"\\s*("+UNIT_WORD+")(?:\\s*/\\s*(?:人|guest|pp))?$","i"));
    if (m) { pushIng(m[1], fracToNum(m[2]), normUnit(m[3])); pendingQty=null; continue; }
    const name = cleanIngName(raw);
    if (pendingQty) { pushIng(name, pendingQty.per, pendingQty.u); pendingQty=null; continue; }
    if (name && name.length<48) pushIng(name, null, null);
  }
  cur.ings = cur.ings.filter(i => i.n && !/^\d+(\.\d+)?\s*(g|ml|oz|lb)?$/i.test(i.n));
  cur.ings.forEach(i => { if (i.per==null) i.per = 1; if (!i.u) i.u = "pc"; i.vendor = routeVendor(i.n, i.vendor); });
  if (cur.ings.length) courses.push(cur);
  return { courses, serves, raw: text };
}

}
function commitScanned(eid) {
  const parsed = window._scanParsed;
  if (!parsed || !parsed.courses.length) return;
  const newIds = [];
  parsed.courses.forEach(c => {
    c.id = uid();
    c.ings = (c.ings||[]).filter(i=>i.n && num(i.per)>=0);
    c.ings.forEach(i => { if (!i.vendor) i.vendor = routeVendor(i.n,""); });
    if (!c.ings.length) return;
    state.recipes.push(c);
    newIds.push(c.id);
  });
  if (eid) {
    const e = evById(eid);
    if (e) e.recipeIds = [...(e.recipeIds||[]), ...newIds];
  }
  save();
  closeModal();
  switchTab("menu");
  renderRecipes();
  alert("已加入 "+newIds.length+" 道菜。");
}

function buildShopItems(e) {
  const map = new Map();
  (e.recipeIds||[]).forEach(rid => {
    const r = recById(rid); if (!r) return;
    (r.ings||[]).forEach(i => {
      const vendor = routeVendor(i.n, i.vendor);
      const raw = num(i.per) * (e.guests||1);
      const key = (i.n+"|"+vendor).toLowerCase();
      if (!map.has(key)) map.set(key, { n:i.n, vendor, raw:0, u:i.u, dishes:[r.name] });
      const it = map.get(key);
      it.raw += raw;
      if (!it.dishes.includes(r.name)) it.dishes.push(r.name);
    });
  });
  (state.inventory||[]).forEach(row => {
    if (num(row.par)>0 && num(row.qty)+1e-9 < num(row.par)) {
      const vendor = routeVendor(row.n, row.vendor);
      const key = (row.n+"|"+vendor).toLowerCase();
      const gap = num(row.par) - num(row.qty);
      if (!map.has(key)) map.set(key, { n:row.n, vendor, raw:0, u:row.u, dishes:["安全庫存"] });
      map.get(key).parGap = gap;
    }
  });
  return [...map.values()].map(it => {
    const have = haveQty(it.n, it.u);
    const needB = toBase(it.raw, it.u);
    let buyRaw = it.raw;
    if (have>0 && needB.q>0) {
      const remainB = Math.max(0, needB.q - have);
      const back = fromBase(remainB, needB.b, it.u);
      buyRaw = back.qty;
    }
    if (it.parGap) buyRaw = Math.max(buyRaw, it.parGap);
    const covered = buyRaw <= 1e-9;
    const rnd = covered ? { qty:0, unit: it.u } : shopRound(it.n, buyRaw, it.u);
    return {
      ...it, ...rnd, covered,
      have,
      label: covered ? "庫存夠" : fmtQty(rnd.qty, rnd.unit)
    };
  }).sort((a,b)=> Number(a.covered)-Number(b.covered) || a.vendor.localeCompare(b.vendor) || a.n.localeCompare(b.n));
}

function buildShop() {
  const e = activeEv();
  if (!e) { alert("先建一場活動"); return; }
  e.shopStamp = Date.now();
  save();
  renderShop();
}

function renderShop() {
  const sel = $("#shopEvent");
  sel.innerHTML = state.events.map(e=>`<option value="${e.id}" ${e.id===state.activeEvent?"selected":""}>${fmtDate(e.date)} · ${esc(e.title)} · ${e.guests}位</option>`).join("");
  const e = activeEv();
  if (!e) { $("#shopList").innerHTML = `<div class="empty">沒有活動</div>`; return; }
  const items = buildShopItems(e);
  const stores = {};
  items.forEach(i => (stores[i.vendor] ||= []).push(i));
  $("#shopHint").textContent = `${fmtDate(e.date)}｜${e.guests} 位｜${(e.recipeIds||[]).length} 道菜｜已扣庫存，只列出要買的。`;
  if (!items.length) {
    $("#shopList").innerHTML = `<div class="empty">這場還沒套菜單。回行程打開活動，套用菜品或貼上食譜。</div>`;
    return;
  }
  e.bought = e.bought || {};
  $("#shopList").innerHTML = Object.entries(stores).map(([vendor, list]) => {
    const info = STORES[vendor] || {};
    return `<div class="event">
      <div class="split">
        <div>
          <h3 style="margin:0">${esc(vendor)}</h3>
          <div class="muted">${esc(info.type||"")}${info.addr?" · "+info.addr:""}</div>
        </div>
        <span class="pill">${list.length} 項</span>
      </div>
      <div class="links">
        ${info.maps?`<a class="btn" target="_blank" rel="noopener" href="${info.maps}">地圖／導航</a>`:""}
        ${info.web?`<a class="btn" target="_blank" rel="noopener" href="${info.web}">官網</a>`:""}
        ${info.phone?`<a class="btn" href="tel:${info.phone.replace(/\D/g,"")}">打電話</a>`:""}
      </div>
      ${list.map(i=>{
        const key = (i.n+"|"+i.vendor).toLowerCase();
        const done = !!e.bought[key];
        return `<div class="shop-item">
          <input class="check" type="checkbox" ${done?"checked":""} onchange="toggleBought('${e.id}','${escAttr(key)}',this.checked)">
          <div style="${done?"opacity:.45;text-decoration:line-through":""}">
            <b>${esc(i.n)}</b>
            <div class="vendor-name">${esc(i.dishes.map(d=>d.split("·")[0].trim()).join("、"))}${i.have? " · 庫存已抵一部分":""}${i.covered?" · 不用買":""}</div>
          </div>
          <div class="qty-badge">${esc(i.label)}</div>
        </div>`;
      }).join("")}
    </div>`;
  }).join("");
}
function toggleBought(eid, key, val) {
  const e = evById(eid); e.bought = e.bought || {}; e.bought[key] = val; save();
}
function clearBought() {
  const e = activeEv(); if (!e) return;
  e.bought = {}; save(); renderShop();
}

function pickCogsEvent(id) {
  state.activeEvent = id;
  const e = evById(id);
  if (e) { state.guests = e.guests; state.price = e.price || 175; $("#guests").value = state.guests; $("#price").value = state.price; }
  save(); renderCogs();
}
function revenue() {
  if (num(state.totalRev)>0) return num(state.totalRev);
  return num(state.guests) * num(state.price);
}
function roughFoodCost(e) {
  const items = buildShopItems(e||activeEv()||{guests:state.guests,recipeIds:[]});
  return items.length * 0;
}
function renderCogs() {
  const sel = $("#cogsEvent");
  sel.innerHTML = state.events.map(e=>`<option value="${e.id}" ${e.id===state.activeEvent?"selected":""}>${fmtDate(e.date)} · ${esc(e.title)}</option>`).join("");
  $("#guests").value = state.guests;
  $("#price").value = state.price;
  $("#totalRev").value = state.totalRev || "";
  $("#cogsPct").value = state.cogsPct;
  const e = activeEv();
  const rev = revenue();
  const tgt = rev * (state.cogsPct/100);
  const perG = state.guests ? tgt/state.guests : 0;
  const nDishes = (e?.recipeIds||[]).length || 5;
  $("#eventMetrics").innerHTML = `
    <div class="metric wide"><span>總餐費</span><b>${money(rev)}</b></div>
    <div class="metric"><span>目標食材 ${state.cogsPct}%</span><b>${money(tgt)}</b></div>
    <div class="metric"><span>剩餘（工時／利潤）</span><b>${money(rev-tgt)}</b></div>
    <div class="metric"><span>每位食材預算</span><b>${money(perG)}</b></div>
    <div class="metric"><span>每道平均預算</span><b>${money(nDishes?tgt/nDishes:0)}</b></div>
  `;
  $("#actualBox").innerHTML = `<p class="foot-note">${e?fmtDate(e.date)+" · "+e.title+" · "+e.guests+" 位":""}。食材進價可在舊版菜品成本裡細算；這裡先鎖採購上限，避免現場超支。</p>`;
}

const CATS = ["全部","附近","海鮮","肉類","和牛","蔬果","日料","亞洲","超市","線上","批發","特色"];
function renderVendors() {
  $("#vChips").innerHTML = CATS.map(c=>`<button class="chip ${state.vFilter===c?"on":""}" onclick="state.vFilter='${c}';renderVendors()">${c}</button>`).join("");
  const q = ($("#vSearch").value||"").toLowerCase();
  const list = VENDORS.filter(v=>{
    const hay = (v.name+" "+v.note+" "+v.addr+" "+v.cat.join(" ")).toLowerCase();
    if (q && !hay.includes(q)) return false;
    if (state.vFilter!=="全部" && !v.cat.includes(state.vFilter)) return false;
    return true;
  });
  $("#vendorList").innerHTML = list.map(v=>`
    <article class="card">
      <div class="split"><h3 class="serif" style="margin:0;color:var(--gold2)">${esc(v.name)}</h3><span class="pill">${esc(v.type)}</span></div>
      <div class="tags" style="margin:8px 0">${v.cat.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
      <p class="muted">${v.addr? "📍 "+esc(v.addr):""}${v.phone?"<br>☎ "+esc(v.phone):""}</p>
      <p class="hint">${esc(v.note)}</p>
      <div class="links">
        ${v.web?`<a class="btn gold" target="_blank" rel="noopener" href="${v.web}">官網</a>`:""}
        ${v.maps?`<a class="btn" target="_blank" rel="noopener" href="${v.maps}">地圖</a>`:""}
        ${v.phone?`<a class="btn" href="tel:${v.phone.replace(/\D/g,"")}">打電話</a>`:""}
      </div>
    </article>
  `).join("");
}

function closeModal(){ $("#modal").classList.add("hidden"); }

["guests","price","totalRev","cogsPct"].forEach(id=>{
  document.addEventListener("input", ev => {
    if (ev.target && ev.target.id===id) {
      state[id] = ev.target.id==="totalRev" ? ev.target.value : num(ev.target.value);
      const e = activeEv();
      if (e && (id==="guests"||id==="price")) {
        if (id==="guests") e.guests = state.guests;
        if (id==="price") e.price = state.price;
      }
      save(); renderCogs();
    }
  });
});

function renderInv() {
  const q = ($("#invSearch") && $("#invSearch").value || "").toLowerCase();
  const f = state.invFilter || "全部";
  const locs = ["全部","冰箱","冷凍","乾貨","低於安全庫存"];
  if ($("#invChips")) {
    $("#invChips").innerHTML = locs.map(c=>`<button class="chip ${f===c?"on":""}" onclick="state.invFilter='${c}';renderInv()">${c}</button>`).join("");
  }
  const rows = (state.inventory||[]).filter(i=>{
    if (q && !`${i.n} ${i.loc} ${i.vendor}`.toLowerCase().includes(q)) return false;
    if (f==="低於安全庫存") return num(i.par)>0 && num(i.qty)<num(i.par);
    if (f!=="全部" && i.loc!==f) return false;
    return true;
  });
  if (!rows.length) {
    $("#invList").innerHTML = `<div class="empty">沒有庫存。點右上角入庫。</div>`;
    return;
  }
  $("#invList").innerHTML = rows.map(i=>{
    const low = num(i.par)>0 && num(i.qty)+1e-9 < num(i.par);
    return `<article class="recipe">
      <div class="split">
        <div>
          <h3 style="margin:0 0 4px;font-size:16px;color:var(--gold2)">${esc(i.n)}</h3>
          <div class="muted">${esc(i.loc||"")} · ${esc(i.vendor||"")}${i.exp?" · 效期 "+esc(i.exp):""}${low?" · 低於安全庫存":""}</div>
        </div>
        <div class="qty-badge">${i.qty} ${esc(i.u)}</div>
      </div>
      <div class="btn-row">
        <button class="btn" onclick="adjustInv('${i.id}',-1)">－</button>
        <button class="btn" onclick="adjustInv('${i.id}',1)">＋</button>
        <button class="btn" onclick="openInvForm('${i.id}')">編輯</button>
        <button class="danger" onclick="delInv('${i.id}')">刪</button>
      </div>
    </article>`;
  }).join("");
}
function openInvForm(id) {
  const row = id ? (state.inventory||[]).find(x=>x.id===id) : { id:uid(), n:"", qty:1, u:"pc", loc:"冰箱", par:0, exp:"", vendor:"" };
  window.draftI = JSON.parse(JSON.stringify(row));
  $("#sheet").innerHTML = `
    <h2 class="serif" style="margin:0 0 10px;color:var(--gold2)">${id?"編輯庫存":"入庫"}</h2>
    <div class="field"><label>品名</label><input id="in" value="${escAttr(row.n)}"></div>
    <div class="row" style="margin-top:8px">
      <div class="field"><label>數量</label><input id="iq" type="number" step="0.01" value="${row.qty}"></div>
      <div class="field"><label>單位</label>
        <select id="iu">${["pc","oz","lb","bunch","g"].map(u=>`<option ${row.u===u?"selected":""}>${u}</option>`).join("")}</select>
      </div>
    </div>
    <div class="row" style="margin-top:8px">
      <div class="field"><label>位置</label>
        <select id="il">${["冰箱","冷凍","乾貨"].map(l=>`<option ${row.loc===l?"selected":""}>${l}</option>`).join("")}</select>
      </div>
      <div class="field"><label>安全庫存 par</label><input id="ip" type="number" step="0.01" value="${row.par||0}"></div>
    </div>
    <div class="row" style="margin-top:8px">
      <div class="field"><label>效期</label><input id="ie" type="date" value="${escAttr(row.exp||"")}"></div>
      <div class="field"><label>常用商家</label><input id="iv" list="storelist" value="${escAttr(row.vendor||"")}"></div>
    </div>
    <datalist id="storelist">${Object.keys(STORES).map(s=>`<option value="${escAttr(s)}">`).join("")}</datalist>
    <div class="btn-row">
      <button class="btn gold" onclick="commitInv('${row.id}')">儲存</button>
      <button class="btn ghost" onclick="closeModal()">取消</button>
    </div>
  `;
  $("#modal").classList.remove("hidden");
}
function commitInv(id) {
  const obj = {
    id, n: $("#in").value.trim() || "未命名",
    qty: num($("#iq").value), u: $("#iu").value,
    loc: $("#il").value, par: num($("#ip").value),
    exp: $("#ie").value, vendor: $("#iv").value.trim()
  };
  const i = (state.inventory||[]).findIndex(x=>x.id===id);
  if (i>=0) state.inventory[i] = obj;
  else { state.inventory = state.inventory||[]; state.inventory.push(obj); }
  save(); closeModal(); renderInv();
}
function adjustInv(id, dir) {
  const row = (state.inventory||[]).find(x=>x.id===id);
  if (!row) return;
  const step = isCount(row.n, row.u) || normUnit(row.u)==="pc" || normUnit(row.u)==="bunch" ? 1 : (normUnit(row.u)==="lb"?0.5:1);
  row.qty = Math.max(0, +(num(row.qty)+dir*step).toFixed(2));
  save(); renderInv();
}
function delInv(id) {
  if (!confirm("刪除此庫存？")) return;
  state.inventory = (state.inventory||[]).filter(x=>x.id!==id);
  save(); renderInv();
}
function consumeForEvent() {
  const e = activeEv();
  if (!e) return alert("先選一場活動");
  const items = [];
  (e.recipeIds||[]).forEach(rid => {
    const r = recById(rid); if (!r) return;
    (r.ings||[]).forEach(i => items.push({ n:i.n, raw:num(i.per)*(e.guests||1), u:i.u }));
  });
  if (!items.length) return alert("這場沒有菜單");
  if (!confirm("依目前活動菜單從庫存扣除用量？")) return;
  items.forEach(it => {
    const row = invMatch(it.n);
    if (!row) return;
    const have = toBase(row.qty, row.u);
    const need = toBase(it.raw, it.u);
    if (have.b !== need.b) {
      if (isCount(it.n, it.u) && isCount(row.n, row.u)) row.qty = Math.max(0, num(row.qty)-it.raw);
      return;
    }
    const left = fromBase(Math.max(0, have.q-need.q), have.b, row.u);
    row.qty = +(left.qty).toFixed(2);
  });
  save(); renderInv(); alert("已扣庫存。不夠的請看出採購單。");
}
function receiveBought() {
  const e = activeEv();
  if (!e) return;
  const items = buildShopItems(e).filter(i => !i.covered && e.bought && e.bought[(i.n+"|"+i.vendor).toLowerCase()]);
  if (!items.length) return alert("採購單裡沒有已勾選的品項。先去採購勾「買到了」。");
  items.forEach(it => {
    let row = invMatch(it.n);
    const add = it.rawUnit ? shopRound(it.n, it.qty, it.rawUnit) : it;
    if (!row) {
      row = { id:uid(), n:it.n, qty:0, u:it.rawUnit||it.u||"pc", loc:"冰箱", par:0, exp:"", vendor:it.vendor };
      state.inventory.push(row);
    }
    const have = toBase(row.qty, row.u);
    const inc = toBase(it.qty, it.rawUnit||it.u);
    if (have.b===inc.b) {
      const sum = fromBase(have.q+inc.q, have.b, row.u);
      row.qty = +sum.qty.toFixed(2);
    } else row.qty = +(num(row.qty)+num(it.qty)).toFixed(2);
  });
  save(); switchTab("inv"); alert("已入庫。");
}

load();
renderCal();
renderRecipes();
renderShop();
renderInv();
renderCogs();
renderVendors();
</script>
